<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{CSP}}; media-src {{CSP}}; style-src {{CSP}}; script-src 'nonce-{{NONCE}}';">
<link rel="stylesheet" href="{{CSS}}"><title>IKUN 练习室</title></head>
<body data-mode="{{MODE}}" data-motion="{{MOTION}}" data-volume="{{VOLUME}}">
<main><header><span class="brand">IKUN<span class="club"> / CLUB</span></span><span class="number">02½</span></header>
<section class="intro"><div><h1>IKUN 主题</h1><p>黑白底色，篮球橙点缀。</p></div><img id="sticker" src="{{IMAGE}}" width="112" height="112" alt="银灰中分、黑白背带裤的动漫篮球练习生"></section>
<section aria-labelledby="appearance"><h2 id="appearance">配色</h2><div class="themes">
<button data-command="daily"><span class="swatch dark"></span><span>背带裤黑<small>日常 · 安静写代码</small></span></button>
<button data-command="light"><span class="swatch light"></span><span>球场白<small>日常 · 清爽浅色</small></span></button>
<button data-command="stage"><span class="swatch stage"></span><span>舞台夜<small>整活 · 一点点紫调</small></span></button>
</div></section>
<section aria-labelledby="practice"><h2 id="practice">互动 <span>手动播放</span></h2><div class="controls"><button id="bounce">运个球</button><button id="sound" aria-pressed="false">播放节拍</button></div><p id="message" role="status" aria-live="polite"></p><audio id="audio" preload="none" controls hidden></audio></section>
<footer><button class="link" data-command="restore">恢复之前的外观</button><span>纯本地 · 无自动播放</span></footer></main>
<script nonce="{{NONCE}}" src="{{JS}}"></script></body></html>
